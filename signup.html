<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>SEQUENS · Create your Lesson Engine account</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F7F9;--card:#fff;--ink:#12303f;--muted:#54718A;--terra:#0A7A67;--terra-deep:#0A7563;--rule:#D7E4EA}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Lexend,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:0 2px 16px rgba(10,61,98,.08);padding:30px 28px;width:min(420px,92vw)}
h1{font-family:'Schibsted Grotesk',sans-serif;font-size:1.4rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
label{display:block;font-size:.8rem;font-weight:600;margin:14px 0 5px}
input{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;font-family:inherit;font-size:.95rem}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:999px;background:var(--terra);color:#fff;font-family:'Schibsted Grotesk',sans-serif;font-weight:600;font-size:.95rem;cursor:pointer}
button:disabled{background:#a9cfc7}
.msg{margin-top:14px;font-size:.85rem;min-height:1.2em}.err{color:#C0453B}.ok{color:var(--terra-deep)}
.foot{margin-top:16px;font-size:.82rem;color:var(--muted)}.foot a{color:var(--terra-deep)}
</style></head><body>
<div class="card">
  <h1>Create your account</h1>
  <p class="sub">Your own Lesson Engine. Your curriculum, your class, your data.</p>
  <label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@school">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password" placeholder="at least 8 characters">
  <button id="go">Create account</button>
  <div class="msg" id="msg"></div>
  <p class="foot">Already have one? <a href="/app/">Sign in</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient('https://ezilsbplvmuomdrkzdsh.supabase.co','sb_publishable_i4Mc6yA4b3a-e6TYRWd-xQ__7pA2A8x');
const msg=document.getElementById('msg'), go=document.getElementById('go');
go.onclick=async()=>{
  const email=document.getElementById('email').value.trim(), pw=document.getElementById('pw').value;
  if(!email||!email.includes('@')){msg.className='msg err';msg.textContent='Enter a valid email.';return;}
  if(pw.length<8){msg.className='msg err';msg.textContent='Password needs at least 8 characters.';return;}
  go.disabled=true;go.textContent='Creating...';msg.textContent='';
  const {data,error}=await sb.auth.signUp({email,password:pw});
  if(error){msg.className='msg err';msg.textContent=error.message;go.disabled=false;go.textContent='Create account';return;}
  if(data.session){ // no email confirmation required: ensure profile row, go to pricing
    await sb.from('engine_accounts').upsert({user_id:data.user.id,email:email},{onConflict:'user_id'});
    location.href='/app/upgrade.html';
  } else { msg.className='msg ok'; msg.textContent='Check your email to confirm, then sign in.'; go.textContent='Account created'; }
};
</script></body></html>
