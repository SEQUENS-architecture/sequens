<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>SEQUENS · Lesson Engine plans</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F7F9;--card:#fff;--ink:#12303f;--muted:#54718A;--terra:#0A7A67;--terra-deep:#0A7563;--rule:#D7E4EA;--gold-soft:#F3ECD2;--gold-deep:#7C5D13}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Lexend,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
.wrap{width:min(720px,94vw)}h1{font-family:'Schibsted Grotesk',sans-serif;font-size:1.5rem;margin:0 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
.plan{background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:0 2px 16px rgba(10,61,98,.08);padding:24px}
.plan.best{border-color:var(--terra)}
.tag{font-family:'Schibsted Grotesk',sans-serif;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--gold-deep);background:var(--gold-soft);border-radius:999px;padding:.2rem .5rem}
.plan h2{font-family:'Schibsted Grotesk',sans-serif;font-size:1.1rem;margin:8px 0 2px}
.price{font-family:'Schibsted Grotesk',sans-serif;font-size:1.8rem;font-weight:700;margin:6px 0}.price span{font-size:.9rem;color:var(--muted);font-weight:400}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:999px;background:var(--terra);color:#fff;font-family:'Schibsted Grotesk',sans-serif;font-weight:600;cursor:pointer}
button:disabled{background:#a9cfc7}.msg{text-align:center;margin-top:16px;font-size:.85rem;color:#C0453B;min-height:1.2em}
.foot{text-align:center;margin-top:16px;font-size:.82rem;color:var(--muted)}.foot a{color:var(--terra-deep)}
</style></head><body>
<div class="wrap">
  <h1>Choose your plan</h1>
  <p class="sub">Full access to the Lesson Engine. Cancel anytime.</p>
  <div class="grid">
    <div class="plan"><h2>Monthly</h2><div class="price">set your price<span> / month</span></div>
      <p class="sub" style="text-align:left;margin:0 0 4px">Rolling, cancel anytime.</p>
      <button data-plan="monthly">Choose monthly</button></div>
    <div class="plan best"><span class="tag">Best value</span><h2>Annual</h2><div class="price">set your price<span> / year</span></div>
      <p class="sub" style="text-align:left;margin:0 0 4px">The whole school year in one.</p>
      <button data-plan="annual">Choose annual</button></div>
  </div>
  <div class="msg" id="msg"></div>
  <p class="foot">Not signed in? <a href="/app/signup.html">Create an account</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient('https://ezilsbplvmuomdrkzdsh.supabase.co','sb_publishable_i4Mc6yA4b3a-e6TYRWd-xQ__7pA2A8x');
const msg=document.getElementById('msg');
document.querySelectorAll('button[data-plan]').forEach(b=>b.onclick=async()=>{
  msg.textContent='';const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='/app/signup.html';return;}
  b.disabled=true;const was=b.textContent;b.textContent='Starting checkout...';
  try{
    const r=await fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({plan:b.dataset.plan})});
    const j=await r.json();
    if(j.url){location.href=j.url;} else {msg.textContent=j.error||'Could not start checkout.';b.disabled=false;b.textContent=was;}
  }catch(e){msg.textContent='Something went wrong.';b.disabled=false;b.textContent=was;}
});
</script></body></html>
