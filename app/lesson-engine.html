    return out;}
  for(let T=1;T<=tw;T++){const days=cal.weeks[T+SETTLE-1]._days;let ls=[];
    if(kind==="writing")ls=(S.english.weeks[T]?S.english.weeks[T].objectives:[]).map((o,i)=>["WRIT-W"+T+"-"+(i+1),o.objective,o.hinge]);

function wireClass(){
  const SRC=[["cat4_sas","cat4"],["ngrt_sas","ngrt"],["pte_score","pte"],["ptm_score","ptm"]];
  document.getElementById("tpl").onclick=()=>{const rows=["pupil_name,upn,class,cat4_sas,ngrt_sas,pte_score,ptm_score","Example One,A123,6D,102,98,105,99","Example Two,B234,6D,88,,94,"].join("\n");const bl=new Blob([rows],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="sequens-class-template.csv";a.click();URL.revokeObjectURL(a.href);};
  const drop=document.getElementById("drop"),file=document.getElementById("file");
  function pcsv(t){const o=[];let i=0,f="",r=[],q=false;const pf=()=>{r.push(f);f="";},pr=()=>{o.push(r);r=[];};while(i<t.length){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===",")pf();else if(c==="\r"){}else if(c==="\n"){pf();pr();}else f+=c;}i++;}if(f.length||r.length){pf();pr();}return o.filter(x=>x.length>1||(x[0]&&x[0].trim()));}
  function ingest(text){const rows=pcsv(text);if(!rows.length)return;const head=rows[0].map(h=>h.trim().toLowerCase());const ix=n=>head.indexOf(n);const iN=ix("pupil_name");if(iN<0){alert("No pupil_name column. Use the template.");return;}
    const pupils=[];for(let r=1;r<rows.length;r++){const c=rows[r];if(!c[iN]||!c[iN].trim())continue;const rec={name:c[iN].trim(),upn:(ix("upn")>=0?c[ix("upn")]:"").trim(),cls:(ix("class")>=0?c[ix("class")]:"6D").trim()||"6D",scores:{}};SRC.forEach(([col,s])=>{const ci=ix(col);const v=ci>=0?(c[ci]||"").trim():"";if(v&&!isNaN(+v))rec.scores[s]=+v;});pupils.push(rec);}
    const per={};pupils.forEach(p=>{const c=(p.cls||"6?").replace(/[^0-9a-zA-Z]/g,"");per[c]=(per[c]||0)+1;p.code=c+"-"+String(per[c]).padStart(2,"0");});parsed=pupils;window.__cohort=pupils;
    const cnt={};SRC.forEach(([,s])=>cnt[s]=0);pupils.forEach(p=>Object.keys(p.scores).forEach(s=>cnt[s]++));const aN=Object.values(cnt).reduce((a,b)=>a+b,0);
    let h='<div class="card"><h3>Check, then confirm</h3><div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px">'+
      '<div><div class="big" style="font-family:var(--display);font-weight:700;font-size:1.5rem">'+pupils.length+'</div><div class="meta">pupils</div></div>'+
      '<div><div class="big" style="font-family:var(--display);font-weight:700;font-size:1.5rem">'+aN+'</div><div class="meta">score rows</div></div>'+
      SRC.map(([,s])=>'<div><div class="big" style="font-family:var(--display);font-weight:700;font-size:1.5rem">'+cnt[s]+'</div><div class="meta">'+s.toUpperCase()+'</div></div>').join('')+'</div>'+'<div class="meta" style="margin-bottom:10px"><b>By class:</b> '+Object.entries(pupils.reduce((a,p)=>{const c=p.cls||'6?';a[c]=(a[c]||0)+1;return a;},{})).map(function(e){return e[0]+' '+e[1];}).join(' · ')+'</div>'+
      '<div class="tablewrap"><table><tr><th>Code</th><th>Name (on device)</th><th>UPN</th><th>Class</th>'+SRC.map(([,s])=>'<th>'+s.toUpperCase()+'</th>').join('')+'</tr>'+
      pupils.map(p=>'<tr><td style="font-family:var(--display);font-weight:700;color:var(--terra-deep)">'+p.code+'</td><td>'+esc(p.name)+'</td><td class="meta">'+esc(p.upn||"not set")+'</td><td>'+esc(p.cls)+'</td>'+SRC.map(([,s])=>{if(p.scores[s]===undefined)return '<td class="meta">no score</td>';var bd=bandGL(p.scores[s]);return '<td>'+p.scores[s]+(bd?'<span class="bandpill b'+bd+'">'+bd+'</span>':'')+'</td>';}).join('')+'</tr>').join('')+'</table></div>'+
      '<div class="note" style="margin-top:12px">Replaces the current 21 test pupils with these '+pupils.length+'. Map, pacing and hinges untouched. On confirm, writes to the tracker behind the Year 6 lead wall, after ICO for names.</div></div>';
    var lbl=(document.getElementById('ckpt')||{}).value||'Baseline'; ASSESS=ASSESS.filter(function(a){return a.label!==lbl;}); ASSESS.push({label:lbl,pupils:pupils,when:Date.now()}); ASSESS.sort(function(a,b){return CHECKPOINTS.indexOf(a.label)-CHECKPOINTS.indexOf(b.label);});
    h+='<div class="card"><h3>Assessment points stored</h3>'+ASSESS.map(function(a){return '<div class="pgrow" style="grid-template-columns:1fr auto"><div class="lab">'+esc(a.label)+'</div><div class="fig">'+a.pupils.length+' pupils</div></div>';}).join('')+'<div class="foot">'+(ASSESS.length>1?'Open Progress over time to compare any two.':'Upload a second point (a later checkpoint) to compare.')+'</div></div>';
    document.getElementById("review").classList.remove("hide");document.getElementById("review").innerHTML=h;}
  drop.onclick=()=>file.click();

function genOptions(){
  const out=[];
  function push(subj,list){list.forEach(function(it,i){out.push({subj:subj,idx:i,label:subj+' · '+it.title,hinge:it.hinge||null,prior:i>0?subj+' · '+list[i-1].title:null,next:i<list.length-1?subj+' · '+list[i+1].title:null});});}
  push('Maths',DATA.subjects.maths.steps.map(function(s){return {title:s.title,hinge:MHINGE[s.step]};}));
  push('Science',DATA.subjects.science.steps.map(function(s){return {title:s.title,hinge:SHINGE[s.step]};}));
  var ew=[];Object.entries(DATA.subjects.english.weeks).forEach(function(e){e[1].objectives.forEach(function(o){ew.push({title:'W'+e[0]+': '+o.objective.slice(0,52)+(o.objective.length>52?'…':''),hinge:null});});});push('Writing',ew);
  var rd=[];Object.entries(DATA.subjects.reading.weeks).forEach(function(e){e[1].lessons.forEach(function(l){rd.push({title:'W'+e[0]+': '+l.vipers,hinge:null});});});push('Reading',rd);
  var ip=[];Object.entries(DATA.subjects.ipc.weeks).forEach(function(e){e[1].lessons.forEach(function(l){ip.push({title:'W'+e[0]+': '+l.objective.split(':')[0],hinge:null});});});push('IPC',ip);
  return out;
}

    '.wsblank{height:28px;border-bottom:1px dashed #b8c9d3}.wsnote{font-size:8px;color:#9aabb8;font-style:italic}';

  document.getElementById("cmpbody").innerHTML=h;

    h+='</div>'; }

  if(pgAnalyse){ h+='<div class="card"><h3>Every marked objective</h3>';
    var SUBS=[["maths","Maths"],["science","Science"],["writing","Writing"],["reading","Reading"],["ipc","IPC"]];
    SUBS.forEach(function(s){var rows=dailyRows(s[0]);var any=rows.some(function(r){return outcome(r[1]).status!=="pending";});if(!any)return;
      h+='<div class="subj" style="margin:12px 0 4px">'+esc(s[1])+'</div>';
      rows.forEach(function(r){var o=outcome(r[1]);if(o.status==="pending")return;
        h+='<div class="pgrow"><div class="lab" style="font-weight:400;font-size:.82rem">'+esc(r[2]).slice(0,40)+'</div><div>'+svgBar(o.seen-o.behind,o.wt,o.ny,300,["var(--green)","var(--gold)","var(--red)"])+'</div><div class="fig">'+(o.seen-o.behind)+'/'+o.wt+'/'+o.ny+'</div></div>';});});
    h+='</div>'; }
  body.innerHTML=h;

  cp.onclick=function(){
    var t="Y6D PROGRESS REPORT\n\nClass attainment: "+d.met+" met, "+d.wt+" working, "+d.ny+" not yet.\n\nBY SUBJECT\n";
    d.per.forEach(function(p){if(p.total)t+="  "+p.label+": "+p.secure+" secure of "+p.total+", "+p.gaps+" gap(s), "+p.unchecked+" to check\n";});
    if(d.focus.length){t+="\nNEXT STEPS FOR LEARNING\n";d.focus.slice(0,12).forEach(function(g){var nm=nextMove(g.o.seen,g.o.wt,g.o.ny);t+="  "+g.subj+" - "+g.title+"\n    "+g.o.behind+" of "+g.o.seen+" not yet secure. "+nm.t+"\n";});}
    t+="\nDrafted by SEQUENS from the daily layer. Suggestions to confirm.";
    try{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);st.textContent="copied to clipboard";}catch(e){st.textContent="select and copy manually";}
  };
}

// ---------- WEEKLY MEETING (Year lead): toggles + full LO, S2S, misconception ----------
let wkSel=1;
const MTG_SUBJ=[["writing","Writing"],["reading","Reading"],["maths","Maths"],["science","Science"],["ipc","IPC"]];
const mtgOn=new Set(["writing","reading","maths","science","ipc"]);
function outcome(code){
  const s=dstate[code]; if(!s) return {status:'pending',seen:0,behind:0,met:0,wt:0,ny:0,bands:[0,0,0,0,0]};
  const bands=[0,0,0,0,0]; let seen=0;
  Object.values(s.j).forEach(function(v){var b=+v; if(b>=1&&b<=5){seen++;bands[b-1]++;}});
  if(!seen) return {status:'pending',seen:0,behind:0,met:0,wt:0,ny:0,bands:bands};
  var met=bands[3]+bands[4], wt=bands[2], ny=bands[0]+bands[1], behind=wt+ny;
  return {status:behind===0?'secure':'gap',seen:seen,behind:behind,met:met,wt:wt,ny:ny,bands:bands};
}
function subjLessons(k,T){
  const S=DATA.subjects, out=[];
  if(k==="writing"){(S.english.weeks[T]?S.english.weeks[T].objectives:[]).forEach(function(o,i){out.push({lo:o.objective,success:o.success,hinge:o.hinge,suggested:true,code:"WRIT-W"+T+"-"+(i+1)});});}
  else if(k==="reading"){(S.reading.weeks[T]?S.reading.weeks[T].lessons:[]).forEach(function(l,i){out.push({lo:l.vipers+": "+l.objective,success:l.success,hinge:l.hinge,suggested:true,code:"READ-W"+T+"-"+(i+1)});});}
  else if(k==="ipc"){(S.ipc.weeks[T]?S.ipc.weeks[T].lessons:[]).forEach(function(l,i){out.push({lo:l.objective,success:l.success,hinge:l.hinge,suggested:true,code:"IPC-W"+T+"-"+(i+1)});});}
  else if(k==="maths"){const ml=PVLESSONS.slice((T-1)*5,T*5);ml.forEach(function(l){if(l.kind==="pv"){var stp=S.maths.steps[l.step-1];out.push({lo:stp.title,success:stp.success,hinge:l.hinge,code:"WRM-Y6-A1-PV-"+l.step,suggested:false});}});}
  else if(k==="science"){var stp=S.science.steps[T-1];if(stp){out.push({lo:stp.title,success:stp.success,hinge:SHINGE[stp.step],code:"WRS-Y6-A1-LTH-"+stp.step,suggested:false});var p=stp.practical||{};out.push({lo:"Practical: "+(p.objective||""),success:p.success,hinge:null,ws:p.ws,suggested:false});}}
  return out;
}
function weekly(){
  return '<div class="kicker">Year lead</div><div class="h">Weekly meeting</div>'+
    '<div class="sub">Read from the daily layer for the week. Every subject carries its objective, steps to success and the misconception to align on. Toggle subjects on or off. For Writing, Reading and IPC these are SEQUENS-suggested; you confirm.</div>'+
    '<div class="weekpick" id="weekpick"></div><div class="tabs" id="mtgtoggle"></div><div id="sheet"></div>'+
    '<div class="controls" style="margin-top:14px"><button class="btn" id="copymtg">Copy as text</button><span class="meta" id="copystate"></span></div>'+
    '<div class="foot">Honours your own meeting structure. Reads Y6D now; cross-class gaps fill in once the cohort data is uploaded.</div>';
}
function wireWeekly(){
  const wp=document.getElementById("weekpick");wp.innerHTML="";
  for(let w=1;w<=7;w++){const b=document.createElement("button");b.textContent="Week "+w;b.className=(w===wkSel?"sel":"");b.onclick=(function(x){return function(){wkSel=x;wireWeekly();};})(w);wp.appendChild(b);}
  const tg=document.getElementById("mtgtoggle");tg.innerHTML="";
  MTG_SUBJ.forEach(function(p){const b=document.createElement("button");b.className="tab"+(mtgOn.has(p[0])?" sel":"");b.textContent=p[1];b.onclick=function(){if(mtgOn.has(p[0]))mtgOn.delete(p[0]);else mtgOn.add(p[0]);wireWeekly();};tg.appendChild(b);});
  const c=wkById[wkSel];
  const dt=niceD(c.begins)+' '+niceM(c.begins)+' to '+niceD(c.ends)+' '+niceM(c.ends);
  if(wkSel<=SETTLE){
    document.getElementById("sheet").innerHTML='<div class="sheet"><div class="sheet-h"><span class="t">Year 6 · Week '+wkSel+' · Settling</span><span class="d">'+dt+'</span></div><div class="mrow"><div class="subj">Ice breakers and baseline</div><div class="focus">Settling routines, class ice breakers, and baseline assessments. No curriculum objectives this week.</div><div class="dir"><b>Focus:</b> CAT4, NGRT, PTE, PTM and the summer tracker completed and uploaded, so the coded profile builds before teaching starts in Week 2.</div></div></div>';
    document.getElementById("copymtg").onclick=function(){document.getElementById("copystate").textContent="Week 1 is settling and baseline, nothing to schedule.";};
    return;
  }
  const T=wkSel-SETTLE;
  let h='<div class="sheet"><div class="sheet-h"><span class="t">Year 6 · Week '+wkSel+'</span><span class="d">'+dt+'</span></div>';
  let anyGap=0;
  MTG_SUBJ.forEach(function(p){
    if(!mtgOn.has(p[0]))return; const rows=subjLessons(p[0],T); if(!rows.length)return;
    h+='<div class="mrow"><div class="subj">'+esc(p[1])+'</div>';
    rows.forEach(function(r){
      h+='<div style="margin:9px 0 12px;padding-left:11px;border-left:2px solid var(--rule)">';
      h+='<div class="focus">'+esc(r.lo)+'</div>';
      if(r.code){var o=outcome(r.code);
        if(o.status==="gap"){anyGap++;var nm=nextMove(o.seen,o.wt,o.ny);h+='<div class="meta" style="color:var(--red);margin-top:3px"><b>Confirmed gap:</b> '+o.behind+' of '+o.seen+' not yet secure. '+nm.t+'</div>';}
        else if(o.status==="secure"){h+='<div class="meta" style="color:var(--green-deep);margin-top:3px">Secure across the class.</div>';}}
      if(r.success&&r.success.length){h+='<div class="meta" style="margin-top:5px"><b>Steps to success</b>'+(r.suggested?' <span style="color:var(--muted)">suggested</span>':'')+'<ol class="objs" style="margin-top:2px">'+r.success.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';}
      if(r.hinge){h+='<div class="watch" style="margin-top:5px"><b style="font-family:var(--display);font-weight:700;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;display:block">Misconception to align on'+(r.suggested?' (suggested)':'')+'</b>'+esc(r.hinge)+'</div>';}
      else if(r.ws){h+='<div class="meta" style="margin-top:5px"><b>Working scientifically:</b> '+esc(r.ws)+'</div>';}
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  document.getElementById("sheet").innerHTML=h;
  document.getElementById("copymtg").onclick=function(){
    let t="YEAR 6 WEEKLY MEETING - Week "+wkSel+"\n"+dt+"\n";
    MTG_SUBJ.forEach(function(p){ if(!mtgOn.has(p[0]))return; const rows=subjLessons(p[0],T); if(!rows.length)return;
      t+="\n"+p[1].toUpperCase()+"\n";
      rows.forEach(function(r){ t+="  "+r.lo+"\n";
        if(r.code){var o=outcome(r.code); if(o.status==="gap"){var nm=nextMove(o.seen,o.wt,o.ny);t+="    Confirmed gap: "+o.behind+" of "+o.seen+" not yet secure. "+nm.t+"\n";} else if(o.status==="secure"){t+="    Secure across the class.\n";}}
        if(r.success&&r.success.length){t+="    Steps to success"+(r.suggested?" (suggested)":"")+": "+r.success.join("; ")+"\n";}
        if(r.hinge){t+="    Misconception"+(r.suggested?" (suggested)":"")+": "+r.hinge+"\n";} else if(r.ws){t+="    Working scientifically: "+r.ws+"\n";}
      });
    });
    t+="\nDrafted by SEQUENS. Suggestions to confirm and adjust.";
    try{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);document.getElementById("copystate").textContent="copied to clipboard";}
    catch(e){document.getElementById("copystate").textContent="select and copy manually";}
  };
}

buildNav();
render();
</script>
